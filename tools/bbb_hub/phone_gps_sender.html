<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phone GPS Sender</title>
    <style>
      :root {
        --bg: #07101a;
        --card: #0d1a28;
        --line: #28445f;
        --text: #e8f3fd;
        --muted: #8fb2cc;
        --good: #7ef0be;
        --warn: #ffd083;
        --bad: #ff8c82;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 20% 10%, #0c2033 0%, var(--bg) 55%);
        color: var(--text);
      }
      .wrap {
        max-width: 760px;
        margin: 20px auto;
        padding: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 24px;
      }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1 1 220px;
        color: var(--muted);
        font-size: 13px;
      }
      input, button {
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #07101a;
        color: var(--text);
        padding: 10px 12px;
        font-size: 14px;
      }
      button {
        cursor: pointer;
        font-weight: 700;
      }
      .btn-start { border-color: #2e8b67; }
      .btn-stop { border-color: #8a5d35; }
      .state {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .good { color: var(--good); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }
      pre {
        margin: 0;
        overflow: auto;
        background: #050d14;
        border: 1px solid #20384e;
        border-radius: 10px;
        padding: 10px;
        font-size: 12px;
        color: #bee2ff;
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Phone GPS Sender</h1>
        <div style="color: var(--muted); font-size: 14px;">
          Streams iPhone geolocation to BBB ingest endpoint with retry/backoff.
        </div>
      </div>

      <div class="card">
        <div class="row">
          <label>
            Ingest URL
            <input id="ingestUrl" class="mono" placeholder="https://example.com/phone-gps" />
          </label>
          <label>
            Token
            <input id="token" class="mono" type="password" placeholder="PHONE_GPS_TOKEN" />
          </label>
        </div>
        <div class="row" style="margin-top: 10px;">
          <button id="startBtn" class="btn-start">Start GPS Stream</button>
          <button id="stopBtn" class="btn-stop">Stop</button>
        </div>
      </div>

      <div class="card">
        <div id="state" class="state warn">Idle</div>
        <div id="meta" style="margin-top: 6px; color: var(--muted); font-size: 13px;"></div>
      </div>

      <div class="card">
        <div style="margin-bottom: 8px; color: var(--muted);">Last payload</div>
        <pre id="payload">{}</pre>
      </div>
    </div>

    <script>
      const ingestEl = document.getElementById("ingestUrl");
      const tokenEl = document.getElementById("token");
      const stateEl = document.getElementById("state");
      const metaEl = document.getElementById("meta");
      const payloadEl = document.getElementById("payload");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");

      let watchId = null;
      let pendingSample = null;
      let sending = false;
      let backoffMs = 1000;
      let retryTimer = null;
      let sentCount = 0;
      let failCount = 0;

      const STORAGE_KEY = "bbb_phone_gps_sender_v1";

      function setState(text, tone) {
        stateEl.textContent = text;
        stateEl.className = "state " + (tone || "warn");
      }

      function setMeta(text) {
        metaEl.textContent = text;
      }

      function saveConfig() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          ingestUrl: ingestEl.value.trim(),
          token: tokenEl.value,
        }));
      }

      function loadConfig() {
        try {
          const cfg = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (cfg.ingestUrl) ingestEl.value = cfg.ingestUrl;
          if (cfg.token) tokenEl.value = cfg.token;
        } catch (_) {}
      }

      function stopRetryTimer() {
        if (retryTimer) {
          clearTimeout(retryTimer);
          retryTimer = null;
        }
      }

      function scheduleRetry() {
        stopRetryTimer();
        retryTimer = setTimeout(() => {
          retryTimer = null;
          void flushSample();
        }, backoffMs);
      }

      function buildSample(position) {
        const c = position.coords;
        const speedMps = Number.isFinite(c.speed) ? c.speed : 0;
        return {
          lat: c.latitude,
          lng: c.longitude,
          bearing: Number.isFinite(c.heading) ? c.heading : 0,
          speedKph: speedMps > 0 ? speedMps * 3.6 : 0,
          accuracyM: Number.isFinite(c.accuracy) ? c.accuracy : 0,
          timestampMs: Date.now(),
          fixValid: true,
          headingReliable: Number.isFinite(c.heading),
          satellites: 0
        };
      }

      async function flushSample() {
        if (sending || !pendingSample) return;

        const url = ingestEl.value.trim();
        const token = tokenEl.value;
        if (!url) {
          setState("Missing ingest URL", "bad");
          return;
        }

        sending = true;
        saveConfig();

        try {
          const resp = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": token ? ("Bearer " + token) : "",
              "X-Phone-Gps-Token": token || ""
            },
            body: JSON.stringify(pendingSample)
          });
          if (!resp.ok) {
            throw new Error("HTTP " + resp.status);
          }
          pendingSample = null;
          sentCount += 1;
          failCount = 0;
          backoffMs = 1000;
          setState("Streaming GPS", "good");
          setMeta("sent=" + sentCount + " fail=" + failCount + " backoffMs=" + backoffMs);
        } catch (err) {
          failCount += 1;
          backoffMs = Math.min(15000, Math.floor(backoffMs * 1.8));
          setState("Send failed: " + String(err), "bad");
          setMeta("sent=" + sentCount + " fail=" + failCount + " retryInMs=" + backoffMs);
          scheduleRetry();
        } finally {
          sending = false;
          if (pendingSample && !retryTimer) {
            scheduleRetry();
          }
        }
      }

      function onPosition(position) {
        pendingSample = buildSample(position);
        payloadEl.textContent = JSON.stringify(pendingSample, null, 2);
        setMeta("queued update @ " + new Date().toLocaleTimeString());
        void flushSample();
      }

      function onPositionError(err) {
        setState("GPS error: " + err.message, "bad");
      }

      function start() {
        if (!navigator.geolocation) {
          setState("Geolocation unavailable", "bad");
          return;
        }
        if (watchId !== null) {
          setState("Already streaming", "warn");
          return;
        }

        stopRetryTimer();
        backoffMs = 1000;
        setState("Requesting GPS permission...", "warn");
        watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
      }

      function stop() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        stopRetryTimer();
        pendingSample = null;
        sending = false;
        setState("Stopped", "warn");
        setMeta("sent=" + sentCount + " fail=" + failCount);
      }

      startBtn.addEventListener("click", start);
      stopBtn.addEventListener("click", stop);

      loadConfig();
      setMeta("Configure endpoint/token, then Start.");
    </script>
  </body>
</html>
