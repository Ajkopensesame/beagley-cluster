# Install on the BBB as /etc/systemd/journald.conf.d/10-beagley-limits.conf, then
# `systemctl restart systemd-journald` (a deploy step: needs approval, see docs/bbb_deploy_rollback.md).
# Bounds journal size so logs cannot fill the board's flash.
[Journal]
Storage=persistent
SystemMaxUse=150M
SystemKeepFree=300M
SystemMaxFileSize=20M
MaxRetentionSec=14day
