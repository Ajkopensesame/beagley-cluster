# Prefer IPv4 on dual-stack vehicle/hotspot networks.
#
# Some hotspots advertise IPv6 DNS records before they provide a usable IPv6
# default route. Qt then reports Network unreachable before it ever reaches the
# IPv4 address. Keeping the default glibc policy table here, with IPv4-mapped
# addresses raised, makes external map/weather requests deterministic.
label ::1/128       0
label ::/0          1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4

precedence ::1/128       50
precedence ::ffff:0:0/96 100
precedence ::/0          40
precedence 2002::/16     30
precedence ::/96         20
