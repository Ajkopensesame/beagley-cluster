name: Diagnostic Replay Contracts

on:
  # No path filter: this job is a required check and must report on every PR.
  pull_request:
  push:
    branches:
      - main
      - master
      - codex/maplibre-native-yocto-build
    paths:
      - "tools/bbb_hub/**"
      - "tests/**"
      - "tools/schema/**"
      - ".github/workflows/diagnostic-replay-contracts.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # websockets pinned to the version running on the BBB (10.4) so hub integration tests match production.
        run: python3 -m pip install --upgrade pip pytest "websockets==10.4"

      - name: Run all Python hub/tool tests (includes hub integration + watchdog tests)
        run: python3 -m pytest tests -q
