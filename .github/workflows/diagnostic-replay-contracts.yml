name: Diagnostic Replay Contracts

on:
  pull_request:
    paths:
      - "tools/bbb_hub/**"
      - "tests/**"
      - "tools/schema/**"
      - ".github/workflows/diagnostic-replay-contracts.yml"
  push:
    branches:
      - main
      - master
      - codex/maplibre-native-yocto-build
    paths:
      - "tools/bbb_hub/**"
      - "tests/**"
      - "tools/schema/**"
      - ".github/workflows/diagnostic-replay-contracts.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run diagnostic replay contract tests
        run: python3 -m pytest tests/test_diagnostic_replay.py tests/test_fault_recorder.py -q
