name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    name: Repo hygiene checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert required files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f CMakeLists.txt

  build:
    name: Configure + build (WITH_WEBENGINE=OFF)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Qt 6.6.3 (no WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          modules: 'qtwebsockets qtsvg'
          cache: true

      - name: Configure (required)
        # Configure must succeed for WITH_WEBENGINE=OFF (WebEngine package not required).
        run: |
          cmake -S . -B build -G Ninja \
            -DWITH_WEBENGINE=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (continue-on-error until WebEngine Loader fix)
        # KNOWN DEBT: src/ui/Main.qml hard-imports QtWebEngine even when
        # WITH_WEBENGINE=OFF, so the QML compile/link step often fails on this
        # matrix. Configure above remains the required gate; this build step is
        # advisory until a follow-up replaces the hard import with a Loader /
        # conditional module. See README.md "Known debt".
        continue-on-error: true
        run: cmake --build build
